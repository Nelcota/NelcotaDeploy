version: 2
builds:
  - id: panel
    main: ./cmd/nelcota-panel
    binary: nelcota-panel
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    goamd64: [v1, v3]
    flags: [-trimpath, '-pgo=auto']
    ldflags: ['-s -w -X github.com/nelcota/nelcota-deploy/internal/updater.Version=v{{ .Version }}']
  - id: agent
    main: ./cmd/nelcota-agent
    binary: nelcota-agent
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    goamd64: [v1, v3]
    flags: [-trimpath, '-pgo=auto']
    ldflags: ['-s -w -X github.com/nelcota/nelcota-deploy/internal/updater.Version=v{{ .Version }}']
archives:
  - formats: [binary]
    name_template: '{{ .Binary }}_{{ .Os }}_{{ .Arch }}{{ if .Amd64 }}_{{ .Amd64 }}{{ end }}'
checksum:
  name_template: checksums.txt
release:
  draft: true
