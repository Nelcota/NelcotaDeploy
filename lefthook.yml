# Git hooks managed by Lefthook (installed automatically by the "prepare" script).

pre-commit:
  # Runs in order: formatting first, so the checks see the final code.
  piped: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,json,md,yml,yaml}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      run: bun run lint
    - name: typecheck
      run: bun run typecheck
    - name: knip
      run: bun run knip
    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        first_line=$(head -n 1 "{1}")
        pattern='^(feat|fix|refactor|test|docs|chore|perf|style|build|ci|revert)(\([a-z0-9-]+\))?!?: [a-z].{0,71}$'
        if echo "$first_line" | grep -Eq '^(Merge|Revert) '; then exit 0; fi
        if echo "$first_line" | grep -Eq "$pattern"; then exit 0; fi
        echo "Commit message must follow Conventional Commits in English:"
        echo "  <type>(<scope>): <description>"
        echo "  e.g. feat(orders): add pix payment strategy"
        echo "Types: feat, fix, refactor, test, docs, chore, perf, style, build, ci, revert"
        exit 1
