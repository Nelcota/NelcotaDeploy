# Production stack on a single VPS: Traefik (proxy + HTTPS), web (panel) and worker (jobs).
# Only the worker sees the Docker socket.
name: nelcota

services:
  traefik:
    image: traefik:v3.7.17
    container_name: nelcota-ingress
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      PANEL_CONTROL_ADDRESS: ${PANEL_CONTROL_ADDRESS:-172.29.240.10}
    command:
      # The worker switches an application route after its new containers pass health checks.
      - --providers.file.directory=/routes
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.middlewares=nelcota-compress@file
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - routes:/routes:ro
      - ./deploy/traefik/panel.yml:/routes/panel.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - nelcota
      - control-plane

  web:
    build: .
    image: ${NELCOTA_IMAGE:-nelcota-deploy:latest}
    restart: unless-stopped
    command: ["sh", "-c", "bun run db:migrate && bun run start"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/nelcota.db
      WORKSPACE_DIR: /data/workspaces
      PUBLIC_URL: https://${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      TRAEFIK_ENABLED: "true"
    volumes:
      - data:/data
    networks:
      control-plane:
        ipv4_address: ${PANEL_CONTROL_ADDRESS:-172.29.240.10}

  worker:
    image: ${NELCOTA_IMAGE:-nelcota-deploy:latest}
    container_name: nelcota-worker
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: ["bun", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/nelcota.db
      WORKSPACE_DIR: /data/workspaces
      PUBLIC_URL: https://${PANEL_DOMAIN}
      TRAEFIK_ENABLED: "true"
      TRAEFIK_ROUTES_DIR: /routes
      WORKER_ID: worker-1
      WORKER_DOCKER_CONTAINER: nelcota-worker
    # Access to the Docker socket is equivalent to root on the host. Only this service has it.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - data:/data
      - routes:/routes
      - /var/run/docker.sock:/var/run/docker.sock
    # Running jobs get time to finish before the container is killed.
    stop_grace_period: 2m
    healthcheck:
      disable: true
    networks:
      - nelcota

networks:
  nelcota:
    name: nelcota
  control-plane:
    name: nelcota-control
    ipam:
      config:
        - subnet: ${PANEL_CONTROL_SUBNET:-172.29.240.0/24}

volumes:
  data:
  routes:
  letsencrypt:
