<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 -100 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">NelcotaDeploy — your code, your servers</title>
  <desc id="desc">NelcotaDeploy identity. An open-source, self-hosted platform with a panel connected to an agent on your infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b1219"/>
      <stop offset="1" stop-color="#13251f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#9be8c5" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect x="0" y="-100" width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="438" rx="23" fill="none" stroke="#9be8c5" stroke-opacity=".13"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
