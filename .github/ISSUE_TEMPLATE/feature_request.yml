name: Suggest an improvement
description: Propose a feature or behavior change. Write in English.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "Describe the desired outcome and an example use case."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
