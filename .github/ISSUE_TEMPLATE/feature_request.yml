name: Sugerir uma melhoria
description: Proponha uma funcionalidade ou mudança de comportamento.
title: "[Proposta]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema você quer resolver?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: "Descreva o resultado desejado e um exemplo de uso."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas e contexto
