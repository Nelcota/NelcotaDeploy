name: Report a bug
description: Describe incorrect behavior and how to reproduce it.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Write in English. For vulnerabilities, use the private reporting channel in SECURITY.md. Remove secrets and real user data before sharing logs."
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "Commit SHA or output of nelcota-panel version"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Linux distribution, architecture, and relevant Go, Docker, BuildKit, and Caddy versions."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional information
      description: "Only include information that can be shared publicly."
      render: text
