name: Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - run: make tools
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler shellcheck
      - run: make proto && .tools/sqlc generate && git diff --exit-code
      - run: make build test lint
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
      - run: make test-integration
      - run: make bench
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.txt
