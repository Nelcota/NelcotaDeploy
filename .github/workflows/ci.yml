name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.9'

jobs:
  validate:
    name: Validação
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Instalar dependências de desenvolvimento
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler shellcheck
          make tools
      - name: Conferir geração reproduzível
        run: make check-generated
      - name: Compilar, testar e verificar código
        run: make build test lint
      - name: Analisar vulnerabilidades alcançáveis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verificar concorrência
        run: CGO_ENABLED=1 go test -race -count=1 -timeout=180s ./...

  integration:
    name: Integração
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Preparar Docker e Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y caddy
          docker info
      - name: Testar infraestrutura real
        run: make test-integration

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Medir benchmarks
        run: make bench
      - name: Comparar com a base do pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p .tools
          GOBIN="$PWD/.tools" go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          git fetch --depth=1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:internal/events/hub_test.go 2>/dev/null; then
            git worktree add --detach /tmp/nelcota-baseline FETCH_HEAD
            (cd /tmp/nelcota-baseline && go test -run='^$' -bench=. -benchmem -count=6 ./internal/... > /tmp/nelcota-base.bench)
            go test -run='^$' -bench=. -benchmem -count=6 ./internal/... > /tmp/nelcota-current.bench
            scripts/compare-benchmarks.sh /tmp/nelcota-base.bench /tmp/nelcota-current.bench
          else
            echo 'Primeira introdução dos benchmarks: ainda sem base comparável.'
          fi
      - name: Preservar medições
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: |
            bench.txt
            /tmp/nelcota-*.bench
            /tmp/nelcota-benchstat.txt
          if-no-files-found: ignore
          retention-days: 14
