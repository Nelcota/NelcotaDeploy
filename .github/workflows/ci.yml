name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.9'

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck unzip
          mkdir -p .tools
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip -o /tmp/protoc.zip
          echo 'c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4  /tmp/protoc.zip' | sha256sum --check -
          unzip -j /tmp/protoc.zip bin/protoc -d .tools
          make tools
      - name: Check reproducible generation
        run: make check-generated
      - name: Build, test, and lint
        run: make build test lint
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check concurrency
        run: CGO_ENABLED=1 go test -race -count=1 -timeout=180s ./...

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Docker and Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y caddy
          docker info
      - name: Test real infrastructure
        run: make test-integration

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run benchmarks
        run: make bench
      - name: Compare with the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p .tools
          GOBIN="$PWD/.tools" go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          git fetch --depth=1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:internal/events/hub_test.go 2>/dev/null; then
            git worktree add --detach /tmp/nelcota-baseline FETCH_HEAD
            (cd /tmp/nelcota-baseline && go test -run='^$' -bench=. -benchmem -count=6 ./internal/... > /tmp/nelcota-base.bench)
            go test -run='^$' -bench=. -benchmem -count=6 ./internal/... > /tmp/nelcota-current.bench
            scripts/compare-benchmarks.sh /tmp/nelcota-base.bench /tmp/nelcota-current.bench
          else
            echo 'Initial benchmark introduction: no comparable baseline yet.'
          fi
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmarks
          path: |
            bench.txt
            /tmp/nelcota-*.bench
            /tmp/nelcota-benchstat.txt
          if-no-files-found: ignore
          retention-days: 14
