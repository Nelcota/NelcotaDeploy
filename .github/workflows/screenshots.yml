name: Screenshots

# Regenerates docs/screenshots in the Playwright image pinned to web/package.json
# and opens a pull request when images changed.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.9'

jobs:
  screenshots:
    name: Regenerate screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate screenshots
        # Runs `cd web && SCREENSHOTS=1 npx playwright test e2e/screenshots.spec.js` in the pinned container.
        run: make screenshots
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/screenshots
          delete-branch: true
          commit-message: Regenerate interface screenshots
          title: Regenerate interface screenshots
          body: |
            Automated run of `make screenshots` (the Playwright screenshot generator in the pinned container) against `nelcota-panel dev` with simulated data.
          labels: documentation
          add-paths: |
            docs/screenshots
