name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bash -n install.sh
      - run: bash -n deploy/update.sh

  image:
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and publish platform image by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --driver docker-container --use
          docker buildx build --platform "linux/$ARCHITECTURE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file image-metadata.json .
          jq -er '."containerimage.digest"' image-metadata.json > "$ARCHITECTURE.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.architecture }}
          path: ${{ matrix.architecture }}.txt
          if-no-files-found: error
          overwrite: true

  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish multi-platform image and installer bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh run download "$GITHUB_RUN_ID" --pattern 'image-*' --dir digests
          amd64=$(< digests/image-amd64/amd64.txt)
          arm64=$(< digests/image-arm64/arm64.txt)
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" --metadata-file manifest.json \
            "$image@$amd64" "$image@$arm64"
          digest=$(jq -er '."containerimage.descriptor".digest' manifest.json)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "$image@$digest" >/dev/null; then
            echo 'The image is unavailable anonymously. Make the GHCR package public and retry this job.' >&2
            exit 1
          fi

          mkdir -p bundle/nelcota-deploy/deploy/traefik
          cp install.sh docker-compose.yml README.md bundle/nelcota-deploy/
          cp deploy/compose.install.yml deploy/update.sh bundle/nelcota-deploy/deploy/
          cp deploy/traefik/panel.yml bundle/nelcota-deploy/deploy/traefik/
          printf '%s@%s\n' "$image" "$digest" > bundle/nelcota-deploy/deploy/release-image
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C bundle -czf nelcota-deploy.tar.gz nelcota-deploy
          bash deploy/publish-release.sh "$GITHUB_REF_NAME"
